<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 933" role="img" aria-labelledby="title description">
  <title id="title">Upper floor climate zones</title>
  <desc id="description">Upper floor plan traced from the architectural drawing: theater on system 1, loft and the open volume above the family room on system 4.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#e7eee6" stroke-opacity=".025"/>
    </pattern>
    <style>
      .shell { fill: #151b16; stroke: #4a5a4d; stroke-width: 5; stroke-linejoin: round; }
      .wall { fill: none; stroke: #4a5a4d; stroke-width: 5; stroke-linecap: square; }
      .inner { fill: none; stroke: #344239; stroke-width: 2; }
      .soft { fill: none; stroke: #344239; stroke-width: 2; stroke-dasharray: 9 9; }
      .glass { fill: none; stroke: #8b978c; stroke-width: 5; stroke-opacity: .55; }
      .swing { fill: none; stroke: #59665b; stroke-width: 2; }
      .zone { stroke-width: 3; stroke-linejoin: round; }
      .zone-one { fill: #e2a04a; fill-opacity: .12; stroke: #e2a04a; stroke-opacity: .68; }
      .zone-four { fill: #a98ad6; fill-opacity: .12; stroke: #a98ad6; stroke-opacity: .68; }
      .code { font-family: "IBM Plex Mono", monospace; font-size: 21px; font-weight: 600; letter-spacing: 2px; text-anchor: middle; }
      .room { fill: #8b978c; font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: 2px; text-anchor: middle; }
      .detail { fill: #59665b; font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: 1.6px; text-anchor: middle; }
      .tight { fill: #59665b; font-family: "IBM Plex Mono", monospace; font-size: 8px; letter-spacing: .4px; text-anchor: middle; }
      .system { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: 2px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1000" height="933" fill="#0d110e"/>
  <rect width="1000" height="933" fill="url(#grid)"/>

  <!-- Areas with no upper floor above them -->
  <path class="soft" d="M389 59H59V542"/>
  <path class="soft" d="M941 467V874H602"/>
  <text class="detail" x="224" y="300">ROOF BELOW</text>
  <text class="detail" x="800" y="660">ROOF BELOW</text>

  <!-- Exterior shell: 49'-0" x 45'-3" overall -->
  <path class="shell" d="M59 542H389V59H941V467H665V799H602V874H59Z"/>

  <!-- Zone fills -->
  <rect class="zone zone-one" x="395" y="65" width="540" height="396"/>
  <polygon class="zone zone-four" points="395 473 596 473 596 868 65 868 65 548 395 548"/>

  <!-- Theater south wall, split by the double doors to the loft -->
  <path class="wall" d="M389 467H464M531 467H665"/>
  <path class="swing" d="M464 467V434M464 434A33 33 0 0 1 497 467M531 467V434M531 434A33 33 0 0 0 498 467"/>

  <!-- Loft / stair partition and closet -->
  <path class="wall" d="M602 467V799M602 542H665"/>
  <path class="swing" d="M602 538H569M569 538A33 33 0 0 1 602 505"/>
  <text class="tight" x="633" y="512">CLOSET</text>

  <!-- Stair down to the main floor -->
  <text class="tight" x="633" y="562">STAIR</text>
  <path class="inner" d="M602 578h63m-63 17h63m-63 17h63m-63 17h63m-63 17h63m-63 17h63m-63 17h63m-63 17h63m-63 17h63m-63 17h63m-63 17h63m-63 17h63" opacity=".8"/>

  <!-- Loft railing over the family room -->
  <path class="inner" d="M389 548V868M396 548V868"/>

  <!-- Glazing -->
  <path class="glass" d="M665 545V597M665 609V660M665 672V723M772 467H828"/>

  <!-- Labels -->
  <text class="system" x="665" y="130" fill="#e2a04a">SYSTEM 1</text>
  <text class="code" x="665" y="225" fill="#e2a04a">MS-1-2</text>
  <text class="room" x="665" y="250">THEATER</text>
  <text class="detail" x="665" y="272">MEDIA / CINEMA</text>

  <text class="system" x="495" y="575" fill="#a98ad6">SYSTEM 4</text>
  <text class="code" x="495" y="640" fill="#a98ad6">MS-4-2</text>
  <text class="room" x="495" y="664">LOFT</text>
  <text class="detail" x="495" y="685">FLEX SPACE</text>

  <text class="room" x="227" y="700">OPEN TO</text>
  <text class="room" x="227" y="720">FAMILY ROOM</text>
  <text class="detail" x="227" y="744">OPEN TO BELOW</text>

  <g transform="translate(28 800)" opacity=".72">
    <path d="M0 21V0M0 0l-7 10M0 0l7 10" stroke="#8b978c" stroke-width="2" fill="none"/>
    <text x="0" y="38" class="detail">N</text>
  </g>
</svg>
